name: WGSL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: WGSL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import fnmatch
          import os
          import subprocess
          from pathlib import Path

          patterns = (
              "*.wgsl",
              "scripts/wgsl.py",
              "scripts/wgsl_tools.toml",
              "test/scripts/test_wgsl.py",
              "pipescaler/image/utilities/palette_shader_matcher.py",
              ".github/workflows/wgsl.yml",
              ".gitattributes",
              "pyproject.toml",
              "uv.lock",
          )
          relevant = True
          if os.environ["EVENT_NAME"] == "pull_request":
              base = os.environ["BASE_SHA"]
              head = os.environ["HEAD_SHA"]
              result = subprocess.run(
                  ["git", "diff", "--name-only", "--no-renames", "-z",
                   f"{base}...{head}"],
                  check=True, capture_output=True,
              )
              paths = result.stdout.decode("utf-8", errors="surrogateescape").split("\0")
              relevant = any(
                  fnmatch.fnmatchcase(path, pattern)
                  for path in paths if path
                  for pattern in patterns
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"relevant={str(relevant).lower()}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("Running full WGSL validation.\n" if relevant else
                            "No relevant changes; WGSL validation is not needed.\n")
          PY

      - name: Set up uv and Python
        if: steps.changes.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.14'

      - name: Install development dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: uv sync --frozen --only-group dev

      - name: Restore pinned WGSL tools
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/cache@v4
        with:
          path: local/wgsl-tools
          key: wgsl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wgsl_tools.toml') }}

      - name: Install pinned Cargo tools
        id: tools
        if: steps.changes.outputs.relevant == 'true'
        run: uv run --no-sync python scripts/wgsl.py install

      - name: Check WGSL formatting
        if: steps.changes.outputs.relevant == 'true'
        run: uv run --no-sync python scripts/wgsl.py format --check

      - name: Validate expanded WGSL
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: uv run --no-sync python scripts/wgsl.py lint

      - name: Test WGSL tooling without a GPU
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          PIPESCALER_REQUIRE_WGSL_TOOLS: '1'
        run: uv run --no-sync pytest test/scripts/test_wgsl.py
