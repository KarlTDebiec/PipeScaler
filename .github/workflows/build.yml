name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define a cache dependency glob
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pngquant potrace

      - name: Install package dependencies
        id: install
        run: uv sync --all-extras --dev --frozen

      - name: Run ruff
        run: uv run ruff check --output-format=github

      - name: Run ty
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ty check --output-format=github .

      - name: Run pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test

  macOS:
    runs-on: macos-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          brew install cairo pngquant potrace

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install package dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run tests
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test

  Windows:
    runs-on: windows-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system dependencies
        shell: powershell
        run: |
          iwr -Uri http://potrace.sourceforge.net/download/1.16/potrace-1.16.win64.zip -OutFile potrace.zip
          Expand-Archive -Path potrace.zip -DestinationPath potrace
          $exePath = "$(Get-Location)\potrace\potrace-1.16.win64"
          echo "$exePath" | Out-File -FilePath $env:GITHUB_PATH -Append
          iwr -Uri https://github.com/microsoft/DirectXTex/releases/download/nov2021/texconv.exe -OutFile texconv.exe
          Move-Item texconv.exe .\potrace\
          echo "$(Get-Location)\potrace" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run tests
        shell: bash
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test
