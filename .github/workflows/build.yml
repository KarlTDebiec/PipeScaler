name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  Linux:
    runs-on: ubuntu-latest
    env:
      PIPESCALER_POTRACE_LIBRARY: ${{ github.workspace }}/.native/libpotrace.so
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define a cache dependency glob
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Restore or build libpotrace
        uses: ./.github/actions/build-potrace
        with:
          library-path: ${{ env.PIPESCALER_POTRACE_LIBRARY }}

      - name: Install package dependencies
        id: install
        run: uv sync --all-extras --dev --frozen

      - name: Run ruff
        run: uv run ruff check --output-format=github

      - name: Run ty
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ty check --output-format=github .

      - name: Run pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test

  macOS:
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      PIPESCALER_POTRACE_LIBRARY: ${{ github.workspace }}/.native/libpotrace.dylib
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          brew install cairo

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore or build libpotrace
        uses: ./.github/actions/build-potrace
        with:
          library-path: ${{ env.PIPESCALER_POTRACE_LIBRARY }}

      - name: Install package dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run tests
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test

  Windows:
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      PIPESCALER_POTRACE_LIBRARY: ${{ github.workspace }}/.native/potrace.dll
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore or build libpotrace
        uses: ./.github/actions/build-potrace
        with:
          library-path: ${{ env.PIPESCALER_POTRACE_LIBRARY }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run tests
        shell: bash
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test
