name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define a cache dependency glob
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Build libpotrace
        run: |
          library_path=$(uv run --no-project python scripts/build_libpotrace.py .native)
          echo "PIPESCALER_POTRACE_LIBRARY=$library_path" >> "$GITHUB_ENV"

      - name: Install package dependencies
        id: install
        run: uv sync --all-extras --dev --frozen

      - name: Run ruff
        run: uv run ruff check --output-format=github

      - name: Run ty
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ty check --output-format=github .

      - name: Run pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test

  macOS:
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          brew install cairo

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build libpotrace
        run: |
          library_path=$(uv run --no-project python scripts/build_libpotrace.py .native)
          echo "PIPESCALER_POTRACE_LIBRARY=$library_path" >> "$GITHUB_ENV"

      - name: Install package dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run tests
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test

  Windows:
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system dependencies
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path native-tools -Force
          iwr -Uri https://github.com/microsoft/DirectXTex/releases/download/nov2021/texconv.exe -OutFile native-tools/texconv.exe
          echo "$(Get-Location)\native-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build libpotrace
        shell: powershell
        run: |
          $libraryPath = uv run --no-project python scripts/build_libpotrace.py .native
          echo "PIPESCALER_POTRACE_LIBRARY=$libraryPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run tests
        shell: bash
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test
