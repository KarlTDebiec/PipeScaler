name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define a cache dependency glob
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Build libpotrace
        shell: bash
        run: |
          build_dir="$RUNNER_TEMP/potrace"
          mkdir -p "$build_dir" "$GITHUB_WORKSPACE/.native"
          curl --fail --location --retry 3 --max-time 60 \
            https://potrace.sourceforge.net/download/1.16/potrace-1.16.tar.gz \
            --output "$build_dir/potrace.tar.gz"
          echo "be8248a17dedd6ccbaab2fcc45835bb0502d062e40fbded3bc56028ce5eb7acc  $build_dir/potrace.tar.gz" | sha256sum --check
          tar -xzf "$build_dir/potrace.tar.gz" -C "$build_dir"
          cd "$build_dir/potrace-1.16/src"
          cc -O2 -fPIC -DHAVE_INTTYPES_H '-DVERSION="1.16"' -shared \
            curve.c trace.c decompose.c potracelib.c -lm \
            -o "$GITHUB_WORKSPACE/.native/libpotrace.so"
          echo "PIPESCALER_POTRACE_LIBRARY=$GITHUB_WORKSPACE/.native/libpotrace.so" >> "$GITHUB_ENV"

      - name: Install package dependencies
        id: install
        run: uv sync --all-extras --dev --frozen

      - name: Run ruff
        run: uv run ruff check --output-format=github

      - name: Run ty
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ty check --output-format=github .

      - name: Run pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test

  macOS:
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          brew install cairo

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build libpotrace
        shell: bash
        run: |
          build_dir="$RUNNER_TEMP/potrace"
          mkdir -p "$build_dir" "$GITHUB_WORKSPACE/.native"
          curl --fail --location --retry 3 --max-time 60 \
            https://potrace.sourceforge.net/download/1.16/potrace-1.16.tar.gz \
            --output "$build_dir/potrace.tar.gz"
          echo "be8248a17dedd6ccbaab2fcc45835bb0502d062e40fbded3bc56028ce5eb7acc  $build_dir/potrace.tar.gz" | shasum -a 256 --check
          tar -xzf "$build_dir/potrace.tar.gz" -C "$build_dir"
          cd "$build_dir/potrace-1.16/src"
          cc -O2 -fPIC -DHAVE_INTTYPES_H '-DVERSION="1.16"' -dynamiclib \
            curve.c trace.c decompose.c potracelib.c -lm \
            -o "$GITHUB_WORKSPACE/.native/libpotrace.dylib"
          echo "PIPESCALER_POTRACE_LIBRARY=$GITHUB_WORKSPACE/.native/libpotrace.dylib" >> "$GITHUB_ENV"

      - name: Install package dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run tests
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test

  Windows:
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system dependencies
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path native-tools -Force
          iwr -Uri https://github.com/microsoft/DirectXTex/releases/download/nov2021/texconv.exe -OutFile native-tools/texconv.exe
          echo "$(Get-Location)\native-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build libpotrace
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "potrace"
          $libraryPath = Join-Path $env:GITHUB_WORKSPACE ".native/potrace.dll"
          New-Item -ItemType Directory -Force -Path $buildDir, (Split-Path -Parent $libraryPath) | Out-Null
          Invoke-WebRequest -Uri https://potrace.sourceforge.net/download/1.16/potrace-1.16.tar.gz -OutFile "$buildDir/potrace.tar.gz"
          if ((Get-FileHash -LiteralPath "$buildDir/potrace.tar.gz" -Algorithm SHA256).Hash -ne "be8248a17dedd6ccbaab2fcc45835bb0502d062e40fbded3bc56028ce5eb7acc") {
            throw "Potrace source archive checksum mismatch"
          }
          tar -xzf "$buildDir/potrace.tar.gz" -C $buildDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location "$buildDir/potrace-1.16/src"
          cl /nologo /O2 /LD /std:c11 /DHAVE_INTTYPES_H '/DVERSION="1.16"' curve.c trace.c decompose.c potracelib.c /link "/OUT:$libraryPath" /EXPORT:potrace_trace /EXPORT:potrace_state_free
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          echo "PIPESCALER_POTRACE_LIBRARY=$libraryPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run tests
        shell: bash
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test
