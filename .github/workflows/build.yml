name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  Linux:
    runs-on: ubuntu-latest
    env:
      PIPESCALER_POTRACE_LIBRARY: ${{ github.workspace }}/.native/libpotrace.so
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define a cache dependency glob
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Restore libpotrace
        id: potrace
        uses: actions/cache@v4
        with:
          path: ${{ env.PIPESCALER_POTRACE_LIBRARY }}
          key: libpotrace-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Build libpotrace
        if: steps.potrace.outputs.cache-hit != 'true'
        shell: bash
        run: |
          build_dir="$RUNNER_TEMP/potrace"
          mkdir -p "$build_dir" "$GITHUB_WORKSPACE/.native"
          curl --fail --location --retry 3 --max-time 60 \
            https://potrace.sourceforge.net/download/1.16/potrace-1.16.tar.gz \
            --output "$build_dir/potrace.tar.gz"
          echo "be8248a17dedd6ccbaab2fcc45835bb0502d062e40fbded3bc56028ce5eb7acc  $build_dir/potrace.tar.gz" | sha256sum --check
          tar -xzf "$build_dir/potrace.tar.gz" -C "$build_dir"
          cd "$build_dir/potrace-1.16/src"
          cc -O2 -fPIC -DHAVE_INTTYPES_H '-DVERSION="1.16"' -shared \
            curve.c trace.c decompose.c potracelib.c -lm \
            -o "$PIPESCALER_POTRACE_LIBRARY"

      - name: Install package dependencies
        id: install
        run: uv sync --all-extras --dev --frozen

      - name: Run ruff
        run: uv run ruff check --output-format=github

      - name: Check Ruff formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen ruff format --check

      - name: Run ty
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ty check --output-format=github .

      - name: Run pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test

  macOS:
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      PIPESCALER_POTRACE_LIBRARY: ${{ github.workspace }}/.native/libpotrace.dylib
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          brew install cairo

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore libpotrace
        id: potrace
        uses: actions/cache@v4
        with:
          path: ${{ env.PIPESCALER_POTRACE_LIBRARY }}
          key: libpotrace-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Build libpotrace
        if: steps.potrace.outputs.cache-hit != 'true'
        shell: bash
        run: |
          build_dir="$RUNNER_TEMP/potrace"
          mkdir -p "$build_dir" "$GITHUB_WORKSPACE/.native"
          curl --fail --location --retry 3 --max-time 60 \
            https://potrace.sourceforge.net/download/1.16/potrace-1.16.tar.gz \
            --output "$build_dir/potrace.tar.gz"
          echo "be8248a17dedd6ccbaab2fcc45835bb0502d062e40fbded3bc56028ce5eb7acc  $build_dir/potrace.tar.gz" | shasum -a 256 --check
          tar -xzf "$build_dir/potrace.tar.gz" -C "$build_dir"
          cd "$build_dir/potrace-1.16/src"
          cc -O2 -fPIC -DHAVE_INTTYPES_H '-DVERSION="1.16"' -dynamiclib \
            curve.c trace.c decompose.c potracelib.c -lm \
            -o "$PIPESCALER_POTRACE_LIBRARY"

      - name: Install package dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run tests
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test

  Windows:
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      PIPESCALER_POTRACE_LIBRARY: ${{ github.workspace }}/.native/potrace.dll
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore libpotrace
        id: potrace
        uses: actions/cache@v4
        with:
          path: ${{ env.PIPESCALER_POTRACE_LIBRARY }}
          key: libpotrace-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Set up MSVC
        if: steps.potrace.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build libpotrace
        if: steps.potrace.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "potrace"
          $libraryPath = $env:PIPESCALER_POTRACE_LIBRARY
          New-Item -ItemType Directory -Force -Path $buildDir, (Split-Path -Parent $libraryPath) | Out-Null
          Invoke-WebRequest -Uri https://potrace.sourceforge.net/download/1.16/potrace-1.16.tar.gz -OutFile "$buildDir/potrace.tar.gz"
          if ((Get-FileHash -LiteralPath "$buildDir/potrace.tar.gz" -Algorithm SHA256).Hash -ne "be8248a17dedd6ccbaab2fcc45835bb0502d062e40fbded3bc56028ce5eb7acc") {
            throw "Potrace source archive checksum mismatch"
          }
          tar -xzf "$buildDir/potrace.tar.gz" -C $buildDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location "$buildDir/potrace-1.16/src"
          cl /nologo /O2 /LD /std:c11 /DHAVE_INTTYPES_H '/DVERSION="1.16"' curve.c trace.c decompose.c potracelib.c /link "/OUT:$libraryPath" /EXPORT:potrace_trace /EXPORT:potrace_state_free
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run tests
        shell: bash
        run: |
          export PACKAGE_ROOT=${GITHUB_WORKSPACE}/pipescaler
          uv run pytest -v --cov=pipescaler --cov-report term test
